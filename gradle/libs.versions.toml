[versions]
androidGradlePlugin = "9.4.1"
androidxCore = "1.19.1"
androidxLifecycle = "2.11.0"
androidxActivity = "1.13.0"
androidxComposeBom = "2026.09.00"
# Explicit override of the BOM: Material 3 Expressive (MaterialExpressiveTheme,
# LoadingIndicator, ButtonGroup, ButtonDefaults.shapes) is not consumable on 1.4.0 -
# its opt-in annotation is internal there. Alpha accepted deliberately.
androidxMaterial3 = "1.5.0-alpha29"
androidxTest = "1.7.0"
androidxTestExt = "1.3.0"
androidxTestRunner = "1.7.0"
androidxTestEspresso = "3.7.0"
coroutines = "1.11.0"
junit = "4.13.2"
# Capped by KSP, not by choice: Kotlin 2.4.20 is out, but KSP has no 2.4.x build at all
# (latest is 2.3.12, built on Kotlin 2.3.20). KSP is a compiler plugin, so running it
# inside a newer compiler than it was built for breaks Room codegen. 2.3.21 is the top
# of the line KSP actually supports. Revisit when KSP ships 2.4.x.
kotlin = "2.3.21"
nav3Core = "1.2.0"
lifecycleViewmodelNav3 = "2.11.0"
room = "2.8.5"
# KSP versions its own way now (plain semver, no Kotlin prefix). 2.3.12 is built on
# Kotlin 2.3.20, which is what caps the Kotlin version above.
ksp = "2.3.12"
androidxWork = "2.12.0"
# alpha06 -> 1.1.0 stable. Checked before moving, because this key encrypts the
# database key: the public API is identical (the only classes that disappeared are
# compiler-generated $1 inner classes) and both resolve the same Tink 1.8.0, so the
# on-disk EncryptedSharedPreferences format is unchanged. Existing installs keep reading.
androidxSecurity = "1.1.0"
firebase = "34.19.0"
androidxDataStore = "1.2.1"
androidxBiometric = "1.1.0"
sqlcipher = "4.19.1"
coil = "3.6.3"
androidxSqlite = "2.7.1"

[libraries]
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "androidxCore" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidxActivity" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "androidxComposeBom" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3", version.ref = "androidxMaterial3" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui"}
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview"}
androidx-compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4"}
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling"}
androidx-compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest"}
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "androidxLifecycle" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "androidxLifecycle" }
androidx-lifecycle-runtime-ktx = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "androidxLifecycle" }
androidx-lifecycle-process = { module = "androidx.lifecycle:lifecycle-process", version.ref = "androidxLifecycle" }
androidx-biometric = { module = "androidx.biometric:biometric", version.ref = "androidxBiometric" }
sqlcipher = { module = "net.zetetic:sqlcipher-android", version.ref = "sqlcipher" }
androidx-sqlite = { module = "androidx.sqlite:sqlite", version.ref = "androidxSqlite" }
androidx-test-core = { module = "androidx.test:core", version.ref = "androidxTest" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "androidxTestExt" }
androidx-test-espresso-core = { module = "androidx.test.espresso:espresso-core", version.ref = "androidxTestEspresso" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidxTestRunner" }
junit = { module = "junit:junit", version.ref = "junit" }
kotlinx-coroutines-play-services = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-play-services", version.ref = "coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
androidx-navigation3-runtime = { module = "androidx.navigation3:navigation3-runtime", version.ref = "nav3Core" }
androidx-navigation3-ui = { module = "androidx.navigation3:navigation3-ui", version.ref = "nav3Core" }
androidx-lifecycle-viewmodel-navigation3 = { module = "androidx.lifecycle:lifecycle-viewmodel-navigation3", version.ref = "lifecycleViewmodelNav3" }
coil-compose = { module = "io.coil-kt.coil3:coil-compose", version.ref = "coil" }
# Coil 3 moved network fetching into a separate artifact. Without this, coil-compose loads
# local files fine and silently fails on every http(s) URL - which is what blanked the
# Google profile photo while design photos from Drive kept working.
coil-network-okhttp = { module = "io.coil-kt.coil3:coil-network-okhttp", version.ref = "coil" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version = "1.11.0" }
androidx-material-icons-extended = { module = "androidx.compose.material:material-icons-extended" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version = "5.5.0" }
# Held on the 21.x line deliberately. 22.0.0 DELETES the legacy Google Sign-In API -
# GoogleSignIn, GoogleSignInClient, GoogleSignInApi, GoogleSignInResult and
# GoogleSignInStatusCodes are all gone from the artifact (verified by unzipping it),
# and AuthManager/MainActivity/MainScreen are built on exactly those. Moving to 22.x
# means porting sign-in to Credential Manager + AuthorizationClient first, which also
# changes how the Drive appdata token is obtained. 21.6.0 is the newest release that
# still ships the API this app uses.
play-services-auth = { module = "com.google.android.gms:play-services-auth", version = "21.6.0" }
androidx-room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
androidx-room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }
androidx-room-ktx = { module = "androidx.room:room-ktx", version.ref = "room" }
androidx-work-runtime-ktx = { module = "androidx.work:work-runtime-ktx", version.ref = "androidxWork" }
androidx-security-crypto = { module = "androidx.security:security-crypto", version.ref = "androidxSecurity" }
androidx-datastore-preferences = { module = "androidx.datastore:datastore-preferences", version.ref = "androidxDataStore" }
firebase-bom = { module = "com.google.firebase:firebase-bom", version.ref = "firebase" }
# BOM 34 removed every -ktx artifact; the Kotlin API moved into the main modules, so
# the imports in the app are unchanged. Keeping "-ktx" here would fail to resolve.
firebase-auth = { module = "com.google.firebase:firebase-auth" }
firebase-firestore = { module = "com.google.firebase:firebase-firestore" }
firebase-storage = { module = "com.google.firebase:firebase-storage-ktx" }
firebase-appcheck-playintegrity = { module = "com.google.firebase:firebase-appcheck-playintegrity" }
firebase-appcheck-debug = { module = "com.google.firebase:firebase-appcheck-debug" }

[plugins]
android-application = { id = "com.android.application", version.ref = "androidGradlePlugin" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
google-services = { id = "com.google.gms.google-services", version = "4.5.0" }