# CodeQL — advanced setup.
#
# Advanced rather than default so the configuration is a file in this repository that can be
# read, reviewed and changed, instead of a setting held in a web page nobody opens again.
#
# WHY java-kotlin BUILDS, AND actions DOES NOT:
#   CodeQL extracts Kotlin by watching the compiler work. There is no source-reading mode
#   for it - build-mode "none" was tried here first and failed with "could not process any
#   of it", having extracted nothing at all. Kotlin is not Java in this respect; the
#   extractor is a compiler plugin, so without a compile there is nothing to plug into.
#
#   The same failed run proved the other half: Gradle resolved the entire project on a
#   hosted runner in 2m08s, BUILD SUCCESSFUL, on AGP 9 and compileSdk 37. The toolchain is
#   new but the runner handles it, so building here is not the gamble it looked like.
#
#   The "actions" language has no compile step and correctly uses build-mode none.

name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Tuesdays, deliberately not Monday: Dependabot opens its pull requests then, and those
    # already trigger a scan of their own through the pull_request event above.
    - cron: "0 4 * * 2"

# Least privilege. Only the security events upload needs anything beyond read.
permissions:
  contents: read

jobs:
  analyze:
    name: Analyze ${{ matrix.language }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: java-kotlin
            build-mode: manual
          # Scans the workflow files in this directory for the things that go wrong in CI:
          # a third-party action pinned to a mutable tag, a script interpolating untrusted
          # input, permissions wider than the job needs.
          - language: actions
            build-mode: none

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          # security-extended adds the lower-severity and higher-noise rules on top of the
          # default set. Worth it on a codebase this size, where the extra findings are
          # still a readable number.
          queries: security-extended

      - name: Set up JDK
        if: matrix.language == 'java-kotlin'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          # Two of them. Gradle and AGP run on the newer one, while jvmToolchain(17) in
          # app/build.gradle.kts needs a 17 to compile against. Listed in this order so
          # JAVA_HOME ends up pointing at 21.
          java-version: |
            17
            21

      - name: Build the app
        if: matrix.language == 'java-kotlin'
        # No setup-android step. The runner image already ships the SDK with its licences
        # accepted, and AGP downloads any platform it is missing. The action that was here
        # tried to install a legacy "tools" package that no longer exists and died on it -
        # while the very first run, which had no such step, resolved the whole project fine.
        #
        # Debug, not release: release would want a signing keystore that is deliberately
        # not in this repository, and the bytecode CodeQL reads is the same either way.
        #
        # No configuration cache. It is on in gradle.properties, it is a cache of the build
        # configuration that a one-shot runner cannot reuse anyway, and it can skip the
        # very compiler invocations the extractor needs to observe.
        run: ./gradlew :app:assembleDebug --no-daemon --no-configuration-cache --stacktrace

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
